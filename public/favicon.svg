<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Open Source Phonics — stack of books">
  <!-- Standing books, leaning across a baseline -->
  <g stroke="#211a14" stroke-width="1.4" stroke-linejoin="round">
    <!-- teal, leans left -->
    <g transform="rotate(-9 12 56)">
      <rect x="7" y="20" width="9.5" height="36" rx="1.4" fill="#5bb6b1"/>
      <rect x="7" y="20" width="2.6" height="36" fill="#3f8f8b" stroke="none"/>
    </g>
    <!-- mustard, tall -->
    <g transform="rotate(-3 19 56)">
      <rect x="15.5" y="13" width="8.5" height="43" rx="1.4" fill="#d6a128"/>
      <rect x="15.5" y="13" width="2.4" height="43" fill="#ab7d12" stroke="none"/>
    </g>
    <!-- maroon, thin -->
    <g transform="rotate(3 25 56)">
      <rect x="23.5" y="18" width="5.4" height="38" rx="1.2" fill="#5c1a2b"/>
      <rect x="25.4" y="22" width="1.6" height="8" rx="0.8" fill="#f2e9d8" stroke="none"/>
    </g>
    <!-- cream -->
    <g transform="rotate(7 31 56)">
      <rect x="28.5" y="22" width="8" height="34" rx="1.4" fill="#f2e9d8"/>
      <rect x="33.2" y="22" width="2.3" height="34" fill="#d9cdb6" stroke="none"/>
    </g>
    <!-- orange -->
    <g transform="rotate(-2 40 56)">
      <rect x="36" y="16" width="8.5" height="40" rx="1.4" fill="#e0813c"/>
      <rect x="36" y="16" width="2.4" height="40" fill="#b85f24" stroke="none"/>
    </g>
    <!-- red, with bookmark -->
    <g transform="rotate(4 48 56)">
      <rect x="44" y="20" width="8.5" height="36" rx="1.4" fill="#c8473a"/>
      <path d="M47.5 20 h3 v7 l-1.5 -2 l-1.5 2 z" fill="#f2e9d8" stroke="none"/>
    </g>
    <!-- purple, tall -->
    <g transform="rotate(-1 55 56)">
      <rect x="51.5" y="13" width="7.5" height="43" rx="1.4" fill="#5b2a4e"/>
      <rect x="56.6" y="13" width="2.4" height="43" fill="#3f1c37" stroke="none"/>
    </g>
  </g>

  <!-- Horizontal stack, front-left -->
  <g stroke="#211a14" stroke-width="1.4" stroke-linejoin="round">
    <rect x="3" y="44.5" width="25" height="6.2" rx="1.6" fill="#f2e9d8"/>
    <rect x="4.5" y="50.2" width="24" height="6.4" rx="1.6" fill="#2f8f6b"/>
    <rect x="2.5" y="56.1" width="27" height="6.6" rx="1.6" fill="#c8473a"/>
    <circle cx="22.5" cy="59.4" r="1.5" fill="#f2e9d8" stroke-width="1.1"/>
  </g>
</svg>
